name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test infrastructure
        run: docker compose -f infra/docker-compose.test.yml up -d

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 2
          done

      - name: Run migrations
        run: make migrate-test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/campaign_test

      - name: Type check
        run: pnpm --filter '*' exec tsc --noEmit || true

      - name: Lint
        run: pnpm --filter '*' lint || true

      - name: Test API
        run: pnpm --filter @campaign/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/campaign_test
          REDIS_URL: redis://localhost:6380

      - name: Test Web
        run: pnpm --filter @campaign/web test

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down --volumes
